[package]
name = "deezco"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["cookies", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
md-5 = "0.11"
aes = "0.9"
blowfish = "0.10"
cbc = "0.2"
hex = "0.4"
anyhow = "1"
futures-util = "0.3"
dirs = "6"
axum = "0.8"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
libloading = "0.8"
libc = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
mp3lame-encoder = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
